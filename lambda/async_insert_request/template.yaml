AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  AsyncInsertRequest:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Runtime: provided.al2023
      Timeout: 30
      MemorySize: 1024
      Environment:
        Variables:
          DB_HOST: host.docker.internal 
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: resource_request
          DB_PORT: "5439"
          ENV: "DEV"
          EVENT_SNS_TOPIC_ARN: arn:aws:sns:ap-southeast-7:414776912688:resource-request
          PRIORITIZATION_TOPIC_ARN: arn:aws:sns:ap-southeast-7:414776912688:to-prioritize-service
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile
